name: Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Config and Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.adil.taksimetre",
            "appName": "Istanbul-Taksimetre",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Clean, Generate Android Platform and Build APK
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Custom Named APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Istanbul-Taksimetre
          path: android/app/build/outputs/apk/debug/*.apk
          
