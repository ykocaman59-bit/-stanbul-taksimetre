name: Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize NPM and Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android
          npx cap init "Istanbul-Taksimetre" "com.adil.taksimetre" --web-dir www --yes || true

      - name: Rebuild Android Platform Safely
        run: |
          mkdir -p .backup_main
          if [ -d "android/app/src/main" ]; then
            cp -r android/app/src/main/* .backup_main/
            rm -rf android
          fi
          
          npx cap add android || true
          
          if [ "$(ls -A .backup_main)" ]; then
            cp -a .backup_main/. android/app/src/main/
          fi
          
          npx cap copy android

      - name: Grant execute permission for gradlew and Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Custom Named APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Istanbul-Taksimetre
          path: android/app/build/outputs/apk/debug/*.apk
          
