name: Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies and Initialize Android
        run: |
          npm install
          npx cap init --name "Istanbul-Taksimetre" --bundle-id "com.adil.taksimetre" --web-dir www --yes || true
          npx cap add android || true
          npx cap copy android

      - name: Grant execute permission for gradlew and Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Custom Named APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Istanbul-Taksimetre
          path: android/app/build/outputs/apk/debug/*.apk
          
